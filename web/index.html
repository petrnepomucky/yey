<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YeY – Kancelář pro řemeslníky</title>
<meta name="theme-color" content="#1D272F">
<link rel="icon" type="image/png" sizes="32x32" href="/ikony/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/ikony/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YeY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="kalk.js"></script>
<style>
:root{
  --inkoust:#1D272F;--inkoust-2:#2E3B45;--inkoust-3:#3F4D58;--ocel:#5D6B76;
  --metr:#F2B705;--metr-2:#F7CD45;--metr-bg:#FDF8E6;--metr-ink:#7A5E00;
  --papir:#F4F5F2;--karta:#fff;--linka:#D8DCD6;--linka-2:#E6E9E3;--pod:#EEF0EC;
  --ok:#2B7A4B;--ok-bg:#E3F1E8;--pozor:#B3261E;--pozor-bg:#FBEDEC;--info:#1F5FA8;--info-bg:#E6EFF9;--warn:#8A5A00;--warn-bg:#FFF4D6;
  --r:12px;--r-s:8px;--stin:0 1px 2px rgba(29,39,47,.06),0 4px 14px rgba(29,39,47,.05);
  --font:'Barlow',system-ui,'Segoe UI',sans-serif;--font-c:'Barlow Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:16px;line-height:1.45;color:var(--inkoust);background:var(--papir);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--metr);outline-offset:2px}
h1,h2,h3{font-family:var(--font-c);letter-spacing:.2px;margin:0}
h1{font-size:30px;line-height:1.1}h2{font-size:20px}h3{font-size:17px}
.skryt{display:none!important}
.tlumene{color:var(--ocel)}.mal{font-size:13px}.tuc{font-weight:600}.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- hlavička s metrem ---------- */
.hlava{position:sticky;top:0;z-index:30}
.hlava-top{background:var(--inkoust);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:58px}
.znacka{font-family:var(--font-c);font-size:30px;font-weight:700;color:var(--metr);line-height:1;text-decoration:none;letter-spacing:.3px}
.firma-jm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.firma-jm small{display:block;color:#AEB8BF;font-weight:500;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.hledani{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--inkoust-2);border:1px solid var(--inkoust-3);border-radius:10px;padding:0 12px;height:40px;color:#C9D0D5;cursor:pointer;text-align:left}
.hledani:hover{border-color:#5C6B76}
.hledani span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kbd{font-size:12px;border:1px solid #5C6B76;border-radius:5px;padding:1px 6px}
.btn-hl{height:40px;border:0;border-radius:10px;background:var(--metr);color:var(--inkoust);font-weight:700;padding:0 16px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn-hl:hover{background:var(--metr-2)}
.ucet-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--inkoust-3);background:var(--inkoust-2);color:#fff;font-weight:700;cursor:pointer}
.metr-pruh{height:14px;background:var(--metr);position:relative;overflow:hidden}
.metr-pruh::after{content:"";position:absolute;inset:0;opacity:.65;
  background:repeating-linear-gradient(90deg,var(--inkoust) 0 2px,transparent 2px 60px) 0 100%/100% 12px no-repeat,
             repeating-linear-gradient(90deg,var(--inkoust) 0 1px,transparent 1px 12px) 0 100%/100% 6px no-repeat}
.metr-cisla{position:absolute;inset:0;display:flex;font-family:var(--font-c);font-size:9px;font-weight:700;line-height:9px;color:var(--inkoust);pointer-events:none;z-index:1}
.metr-cisla span{width:60px;flex:none;padding-left:4px}

/* ---------- rozvržení ---------- */
.plocha{display:flex;min-height:calc(100vh - 72px)}
.menu{width:232px;flex:none;background:var(--karta);border-right:1px solid var(--linka);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--inkoust);text-decoration:none;font-weight:500;font-size:15px;min-height:44px}
.menu a:hover{background:var(--pod)}
.menu a.akt{background:var(--metr-bg);box-shadow:inset 3px 0 0 var(--metr);font-weight:700}
.menu a svg{flex:none;color:var(--ocel)}.menu a.akt svg{color:var(--inkoust)}
.menu .pocet{margin-left:auto;font-size:12px;color:var(--ocel);font-weight:600}
.menu .pocet.cerv{background:var(--pozor);color:#fff;border-radius:10px;padding:1px 7px}
.menu .odd{font-size:11px;font-weight:700;color:var(--ocel);letter-spacing:1.2px;text-transform:uppercase;padding:14px 12px 4px}
.menu .spodek{margin-top:auto;padding-top:10px;border-top:1px solid var(--linka-2)}
.obsah{flex:1;min-width:0;padding:22px 28px 60px}
.obsah.plna{padding:0}

/* ---------- prvky ---------- */
.karta{background:var(--karta);border:1px solid var(--linka);border-radius:var(--r);padding:18px}
.karta-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.karta-h h2,.karta-h h3{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--linka);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--inkoust);white-space:nowrap}
.btn:hover{border-color:var(--ocel)}
.btn.zl{background:var(--metr);border-color:var(--metr)}.btn.zl:hover{background:var(--metr-2)}
.btn.tm{background:var(--inkoust);border-color:var(--inkoust);color:#fff}.btn.tm:hover{background:var(--inkoust-2)}
.btn.cerv{color:var(--pozor)}.btn.cerv:hover{border-color:var(--pozor)}
.btn.mal{height:34px;padding:0 11px;font-size:14px;border-radius:8px}
.btn.ikona{width:42px;padding:0}.btn.mal.ikona{width:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.prazdne{border-color:transparent;background:transparent}.btn.prazdne:hover{background:var(--pod)}
.pole{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--inkoust-2)}
.pole input,.pole select,.pole textarea,.vstup{height:44px;border:1px solid var(--linka);border-radius:9px;padding:0 12px;font-size:15px;font-weight:500;background:#fff;width:100%;color:var(--inkoust)}
.pole textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.pole input:focus,.pole select:focus,.pole textarea:focus,.vstup:focus{outline:0;border-color:var(--inkoust);box-shadow:0 0 0 3px rgba(242,183,5,.35)}
.pole .napoveda{font-weight:400;color:var(--ocel);font-size:12px}
.mrizka{display:grid;gap:12px}
.m2{grid-template-columns:repeat(2,minmax(0,1fr))}.m3{grid-template-columns:repeat(3,minmax(0,1fr))}.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
.radek{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mezera{flex:1}
.cip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;letter-spacing:.2px}
.c-poptavka{background:var(--info-bg);color:var(--info)}.c-nabidka{background:var(--metr-bg);color:var(--metr-ink)}
.c-realizace{background:#E8EDF2;color:var(--inkoust-2)}.c-fakturace{background:var(--warn-bg);color:var(--warn)}
.c-hotovo{background:var(--ok-bg);color:var(--ok)}.c-zruseno{background:var(--pod);color:var(--ocel)}
.c-koncept{background:var(--pod);color:var(--ocel)}.c-odeslano{background:var(--info-bg);color:var(--info)}.c-prijato,.c-zaplaceno,.c-podepsano{background:var(--ok-bg);color:var(--ok)}
.c-odmitnuto,.c-storno,.c-po{background:var(--pozor-bg);color:var(--pozor)}
.filtry{display:flex;gap:6px;flex-wrap:wrap}
.filtry button{border:1px solid var(--linka);background:#fff;border-radius:20px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.filtry button.akt{background:var(--inkoust);border-color:var(--inkoust);color:#fff}
.prazdno{text-align:center;padding:40px 20px;color:var(--ocel)}
.prazdno b{display:block;color:var(--inkoust);font-size:18px;margin-bottom:6px;font-family:var(--font-c)}
table.tab{width:100%;border-collapse:collapse;font-size:15px}
table.tab th{text-align:left;font-size:12px;font-weight:700;color:var(--ocel);text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:2px solid var(--linka)}
table.tab td{padding:11px 10px;border-bottom:1px solid var(--linka-2);vertical-align:middle}
table.tab tr.klik{cursor:pointer}table.tab tr.klik:hover td{background:#FAFBF8}
.r{text-align:right}
.obal-tab{overflow-x:auto}

/* ---------- přehled ---------- */
.uvitani{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi a{background:#fff;border:1px solid var(--linka);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:inherit;display:block;transition:border-color .15s}
.kpi a:hover{border-color:var(--ocel)}
.kpi .l{font-size:14px;color:var(--ocel);font-weight:600}.kpi .v{font-family:var(--font-c);font-size:32px;font-weight:700;margin-top:4px;line-height:1.1}
.kpi .p{font-size:13px;color:var(--ocel);margin-top:2px}
.kpi a.alarm{background:var(--pozor-bg);border-color:#EDBDB8}.kpi a.alarm .l,.kpi a.alarm .v,.kpi a.alarm .p{color:var(--pozor)}
.dva-sl{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.dva-sl>.hl{flex:999 1 560px;min-width:0}.dva-sl>.bok{flex:1 1 300px}
.tabule{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.sloupec{background:var(--pod);border-radius:10px;padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}
.sloupec.nad{outline:2px dashed var(--metr);background:var(--metr-bg)}
.sloupec-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ocel);text-transform:uppercase;letter-spacing:.8px;padding:2px 4px}
.kartička{text-decoration:none;color:inherit;display:block;background:#fff;border:1px solid var(--linka);border-radius:9px;padding:10px 11px;cursor:grab;font-size:14px;text-align:left;width:100%}
.kartička:hover{border-color:var(--ocel)}
.kartička b{display:block;font-size:15px}
.kartička .pr{height:4px;background:var(--linka-2);border-radius:2px;margin-top:7px}.kartička .pr i{display:block;height:4px;background:var(--metr);border-radius:2px}
.ukol{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--linka-2);font-size:14px;align-items:flex-start}
.ukol:last-child{border-bottom:0}
.tecka{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}

/* ---------- tři panely (zakázky) ---------- */
.panely{display:flex;min-height:calc(100vh - 72px)}
.p-seznam{width:310px;flex:none;background:#FAFBF8;border-right:1px solid var(--linka);display:flex;flex-direction:column;position:sticky;top:72px;height:calc(100vh - 72px)}
.p-seznam .hlavicka{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--linka-2)}
.p-seznam .polozky{overflow:auto;flex:1}
.p-pol{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linka-2);background:transparent;padding:12px 14px;cursor:pointer;box-shadow:inset 3px 0 0 transparent}
.p-pol:hover{background:#fff}
.p-pol.akt{background:#fff;box-shadow:inset 4px 0 0 var(--metr)}
.p-pol .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.p-pol .t b{font-size:15px}.p-pol .s{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ocel);margin-top:4px}
.p-detail{container-type:inline-size;flex:1;min-width:0;padding:20px 26px 60px;display:flex;flex-direction:column;gap:16px}
.p-nahled{width:370px;flex:none;background:#fff;border-left:1px solid var(--linka);padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.drobky{font-size:14px;color:var(--ocel)}.drobky a{color:var(--ocel);text-decoration:none}.drobky a:hover{text-decoration:underline}
.kroky{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kroky li{padding:9px 11px;border-radius:9px;background:#fff;border:1px solid var(--linka);color:var(--ocel);font-size:13px;position:relative}
.kroky li b{display:block;font-size:14px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-detail .mrizka.m2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
@container (max-width:700px){.kroky li span{display:none}.kroky li{padding:9px 8px}}
.kroky li.hot{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.kroky li.ted{background:var(--inkoust);border-color:var(--inkoust);color:#fff}
.kroky li.ted::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--metr);border-radius:2px}
.dokl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:9px;border:1px solid var(--linka-2);text-decoration:none;color:inherit;cursor:pointer;background:#fff;width:100%;text-align:left}
.dokl:hover{border-color:var(--ocel)}
.dokl.vyb{border-color:var(--metr);background:var(--metr-bg)}
.dokl.chybi{border-style:dashed;color:var(--ocel);background:transparent}
.denik-z{padding:9px 0;border-bottom:1px solid var(--linka-2);font-size:14px;display:flex;gap:10px}
.denik-z time{color:var(--ocel);font-weight:600;white-space:nowrap;min-width:52px}

/* ---------- doklad editor ---------- */
.editor{display:flex;min-height:calc(100vh - 72px)}
.editor .form{flex:1;min-width:0;padding:20px 26px 80px;display:flex;flex-direction:column;gap:16px}
.editor .nahled{width:46%;max-width:680px;flex:none;background:#E7E9E4;padding:22px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.pol-tab{width:100%;border-collapse:collapse;min-width:540px}
.pol-tab th{font-size:12px;color:var(--ocel);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:6px 4px;font-weight:700}
.pol-tab td{padding:3px 4px;vertical-align:middle}
.pol-tab input{width:100%;height:40px;border:1px solid transparent;border-radius:7px;padding:0 8px;background:transparent;font-size:15px}
.pol-tab tr:hover input{border-color:var(--linka-2);background:#fff}
.pol-tab select.kat-sel{width:100%;height:40px;border:1px solid transparent;border-radius:7px;padding:0 4px;background:transparent;font-size:13px;color:var(--ocel)}
.pol-tab select.kat-sel:hover,.pol-tab select.kat-sel:focus{border-color:var(--linka);background:#fff}
.pol-tab input:focus{outline:0;border-color:var(--inkoust);background:#fff;box-shadow:0 0 0 3px rgba(242,183,5,.3)}
.pol-tab .c{text-align:right}
.pol-tab .tah{cursor:grab;color:var(--ocel);width:22px}
.souhrn{display:flex;justify-content:flex-end}
.souhrn table{font-size:15px;min-width:280px}.souhrn td{padding:4px 8px}.souhrn tr.cel td{font-family:var(--font-c);font-size:24px;font-weight:700;border-top:2px solid var(--inkoust);padding-top:8px}
.ulozeno{font-size:13px;color:var(--ok);font-weight:600}

/* ---------- papír dokladu (náhled + tisk) ---------- */
.papir-obal{container-type:inline-size;width:100%}
.papir{background:#fff;color:#15233c;width:100%;aspect-ratio:210/297;padding:7.14cqw;font-family:"Arial Narrow",Arial,"Helvetica Neue",sans-serif;font-size:1.51cqw;box-shadow:0 2px 10px rgba(0,0,0,.12);line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.papir .p-konec{display:flow-root}
/* ---- doklad ve vzhledu yey.cz (rozměry přepočtené z px na šířku A4: 1 px = 0,126 cqw) ---- */
.papir.doc .doc-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.25cqw solid #b0894e;padding-bottom:1.76cqw;margin-bottom:2.27cqw}
.papir.doc .doc-brand{display:flex;gap:1.51cqw;align-items:center}
.papir.doc .doc-logo-img{height:6.3cqw;width:auto;max-width:22cqw;object-fit:contain;display:block}
.papir.doc .doc-name{font-size:2.52cqw;font-weight:700;letter-spacing:.06cqw}
.papir.doc .doc-sub{font-size:1.26cqw;letter-spacing:.25cqw;text-transform:uppercase;color:#8a6a2f}
.papir.doc .doc-title{text-align:right}
.papir.doc .doc-t1{font-size:1.39cqw;letter-spacing:.38cqw;color:#8a6a2f}
.papir.doc .doc-t2{font-size:3.02cqw;font-weight:700}
.papir.doc .doc-parties{display:flex;gap:2cqw;margin-bottom:2cqw}
.papir.doc .doc-box{flex:1;border:1px solid #e6e0d3;border-radius:1cqw;padding:1.51cqw 1.76cqw;font-size:1.45cqw}
.papir.doc .doc-lbl{font-size:1.13cqw;letter-spacing:.25cqw;color:#8a6a2f;margin-bottom:.63cqw}
.papir.doc .doc-strong{font-weight:700;font-size:1.64cqw;margin-bottom:.38cqw}
.papir.doc .doc-rejstrik{font-size:.85em;opacity:.8;margin-top:.38cqw}
.papir.doc .doc-meta{display:flex;border:1px solid #d9d3c6;border-radius:1cqw;margin-bottom:1.76cqw;overflow:hidden}
.papir.doc .doc-meta>div{flex:1;padding:1cqw 1.76cqw;border-right:1px solid #eee3d0}
.papir.doc .doc-meta>div:last-child{border-right:0}
.papir.doc .doc-meta span{display:block;font-size:1.07cqw;letter-spacing:.19cqw;color:#8a6a2f;text-transform:uppercase;margin-bottom:.25cqw}
.papir.doc .doc-meta b{font-size:1.58cqw}
.papir.doc .doc-radek{margin:.25cqw 0 1.51cqw;color:#555;font-size:1.39cqw}
.papir.doc .doc-predmet{margin:.76cqw 0 1.51cqw;font-size:1.51cqw}
.papir.doc .doc-predmet span{color:#8a6a2f;font-weight:700}
.papir.doc table.doc-items{width:100%;border-collapse:collapse;margin-bottom:1.26cqw;table-layout:fixed}
.papir.doc table.doc-items th{color:#15233c;font-size:1.13cqw;letter-spacing:.13cqw;text-transform:uppercase;padding:1cqw;text-align:left;border-bottom:.25cqw solid #15233c;font-weight:700;line-height:1.3}
.papir.doc table.doc-items td{padding:.88cqw 1cqw;border-bottom:1px solid #eee;font-size:1.45cqw;overflow-wrap:anywhere}
.papir.doc table.doc-items .r{text-align:right}
.papir.doc table.doc-items .c{text-align:center;color:#888}
.papir.doc table.doc-items tr.cat td{color:#8a6a2f;font-weight:700;text-transform:uppercase;font-size:1.26cqw;letter-spacing:.13cqw;padding:1.26cqw 1cqw .5cqw;border-bottom:1px solid #15233c}
.papir.doc table.doc-items tr.sub td{font-weight:700;border-top:1px solid #d9d3c6;border-bottom:.25cqw solid #cfc7b5}
.papir.doc .doc-prazdne{color:#888;text-align:center;padding:4cqw}
.papir.doc table.nb th:nth-child(2){width:8cqw}.papir.doc table.nb th:nth-child(3){width:11cqw}.papir.doc table.nb th:nth-child(4){width:13cqw}.papir.doc table.nb th:nth-child(5){width:14cqw}

async function novyDoklad(typ, { zakazka_id = null, kontakt_id = null, zdroj = null, predmet = '' } = {}) {
  const c = await q(sb.rpc('dalsi_cislo', { p_firma: S.firma.id, p_typ: typ }));
  const z = zakazka_id ? zakazka(zakazka_id) : null;
  const o = {
    typ, cislo: c, zakazka_id, kontakt_id: kontakt_id || z?.kontakt_id || zdroj?.kontakt_id || null,
    predmet: predmet || zdroj?.predmet || z?.nazev || '', datum: dnes(), zdroj_id: zdroj?.id || null, stav: 'koncept',
    tisk_rezim: zdroj?.tisk_rezim || 'polozky', souhrn_text: zdroj?.souhrn_text || null, objednavka: zdroj?.objednavka || null
  };
  if (jeFakt(typ)) { o.splatnost = plusDni(dnes(), S.firma.splatnost_dni || 14); o.duzp = dnes(); o.vs = c.replace(/\D/g, ''); }
  if (typ === 'nabidka') o.splatnost = plusDni(dnes(), 30); // platnost nabídky
  const d = await db.ins('doklady', o); S.doklady.unshift(d);
  if (zdroj) {
    const pol = await nactiPolozky(zdroj.id);
    if (pol.length) {
      const nove = pol.map((p, i) => ({ id: uid(), doklad_id: d.id, firma_id: S.firma.id, poradi: i, nazev: p.nazev, mnozstvi: p.mnozstvi, mj: p.mj, cena: p.cena, dph: p.dph, kat: p.kat || null }));

    } else S.polozky[d.id] = [];
  } else S.polozky[d.id] = [];
  if (zakazka_id) zapisDenik(zakazka_id, `${TYP[typ]} ${c} vytvořena`).catch(() => {});
  return doklad(d.id);
}

}

/* ---------- ARES ---------- */
async function ares(ico) {
  ico = String(ico || '').replace(/\D/g, ''); if (ico.length < 6) throw new Error('Zadejte IČO');
  const r = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/' + ico.padStart(8, '0'));
  if (!r.ok) throw new Error('IČO v ARES nenalezeno');
  const j = await r.json(); const a = j.sidlo || {};
  const ulice = a.nazevUlice ? `${a.nazevUlice} ${a.cisloDomovni || ''}${a.cisloOrientacni ? '/' + a.cisloOrientacni : ''}` : (a.nazevCastiObce ? `${a.nazevCastiObce} ${a.cisloDomovni || ''}` : '');
  return { nazev: j.obchodniJmeno, ico: j.ico, dic: j.dic || '', ulice: ulice.trim(), mesto: a.nazevObce || '', psc: a.psc ? String(a.psc).replace(/(\d{3})(\d{2})/, '$1 $2') : '', _ares: j };
}
/* Zápis v rejstříku (§ 435 OZ) z ARES – návrh, uživatel ho zkontroluje */
const SOUDY = { MSPH: 'Městským soudem v Praze', KSPH: 'Krajským soudem v Praze', KSCB: 'Krajským soudem v Českých Budějovicích', KSPL: 'Krajským soudem v Plzni', KSUL: 'Krajským soudem v Ústí nad Labem', KSHK: 'Krajským soudem v Hradci Králové', KSBR: 'Krajským soudem v Brně', KSOS: 'Krajským soudem v Ostravě' };
async function aresZapis(ico, j) {
  ico = String(ico || '').replace(/\D/g, '').padStart(8, '0');
  let sz = ''; (j?.dalsiUdaje || []).forEach(x => { if (!sz && x?.spisovaZnacka) sz = String(x.spisovaZnacka); });
  if (sz) { const m = sz.match(/^\s*([A-Za-z]+)\s+(\d+)\s*\/\s*([A-Z]+)/);
    return m && SOUDY[m[3]] ? `Zapsáno v obchodním rejstříku vedeném ${SOUDY[m[3]]}, oddíl ${m[1]}, vložka ${m[2]}` : 'Zapsáno ve veřejném rejstříku, spisová značka ' + sz; }
  const pf = String(j?.pravniForma || '');
  if (pf && !['101', '105', '107', '424', '425'].includes(pf)) return '';
  let urad = '';
  try { const z = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty-rzp/' + ico);
    if (z.ok) { const zj = await z.json(); const u = (zj.zaznamy || [])[0]?.zivnostenskyUrad || {}; urad = u.nazevUradu || u.nazev || (typeof u === 'string' ? u : ''); } } catch { }
  return 'Fyzická osoba zapsaná v živnostenském rejstříku' + (urad ? ', ' + urad : '');

async function aresVyhledat(nazev, obec) {

}

/* ---------- QR platba (SPAYD) ---------- */
function ibanZUctu(u) {
  if (!u) return '';
  const s = u.replace(/\s/g, '').toUpperCase(); if (/^CZ\d{22}$/.test(s)) return s;
  const m = s.match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/); if (!m) return '';
  const bban = m[3] + (m[1] || '').padStart(6, '0') + m[2].padStart(10, '0');
  const kon = (98n - (BigInt(bban + '123500') % 97n)).toString().padStart(2, '0');
  return 'CZ' + kon + bban;
}
function qrPlatba(d) {
  const iban = S.firma.iban?.replace(/\s/g, '') || ibanZUctu(S.firma.ucet); if (!iban || typeof qrcode === 'undefined') return '';
  const castka = Math.round(kUhrade(d) * 100) / 100; if (castka <= 0) return '';
  const spd = `SPD*1.0*ACC:${iban}*AM:${castka.toFixed(2)}*CC:CZK${d.vs ? '*X-VS:' + d.vs.replace(/\D/g, '').slice(0, 10) : ''}*MSG:${(TYP[d.typ] + ' ' + d.cislo).normalize('NFD').replace(/[̀-ͯ*]/g, '').slice(0, 60)}`;
  try { const qr = qrcode(0, 'M'); qr.addData(spd); qr.make(); return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch { return ''; }
}

/* hlavní tlačítko „další krok“ – průvodce zakázkou */
AKCE.krok = async el => {
  const z = zakazka(el.dataset.id); const dok = S.doklady.filter(d => d.zakazka_id === z.id);
  const nab = dok.find(d => d.typ === 'nabidka' && d.stav !== 'odmitnuto');
  if (z.faze === 'poptavka') {
    if (nab) return jdi('doklad/' + nab.id);
    const d = await novyDoklad('nabidka', { zakazka_id: z.id }); await ulozZakazku(z.id, { faze: 'nabidka' }); return jdi('doklad/' + d.id);
  }
  if (z.faze === 'nabidka') {
    if (!nab) { const d = await novyDoklad('nabidka', { zakazka_id: z.id }); return jdi('doklad/' + d.id); }
    if (nab.stav === 'koncept') return jdi('doklad/' + nab.id);
    Object.assign(nab, await db.upd('doklady', nab.id, { stav: 'prijato' }));
    await ulozZakazku(z.id, { faze: 'realizace' }); zapisDenik(z.id, `Nabídka ${nab.cislo} přijata – začíná realizace`).catch(() => {});
    toast('Zakázka přešla do realizace 🔨'); return render();
  }
  if (z.faze === 'realizace') {
    let prot = dok.find(d => d.typ === 'protokol');
    if (!prot) prot = await novyDoklad('protokol', { zakazka_id: z.id, zdroj: nab });
    await ulozZakazku(z.id, { faze: 'fakturace', postup: 100 }); zapisDenik(z.id, 'Práce dokončeny – předávací protokol').catch(() => {});
    return jdi('doklad/' + prot.id);
  }
  if (z.faze === 'fakturace') {
    let f = dok.find(d => d.typ === 'faktura'); if (!f) f = await novyDoklad('faktura', { zakazka_id: z.id, zdroj: nab });
    return jdi('doklad/' + f.id);
  }
};

    if (vKat) skupiny().forEach(([, n, a]) => { const s2 = a.reduce((x, p) => x + zakl(p), 0); rows += `<tr data-z="${s2}"><td>${esc(n)}</td><td class="c">kpl</td><td class="r">1</td><td class="r">${fmtN(s2)}</td>${sSaz ? `<td class="r">${sazbaTxt(a)}</td>` : ''}<td class="r">${fmtN(s2)}</td></tr>`; });

/* ---- načtení položek z Excelu – převzato beze změny z yey.cz (parseCena, loadXLSX, nbParseTable, xlsAnalyzuj) ---- */
function parseCena(v){
  if(typeof v==='number') return v;
  let s=(v==null?'':(''+v)).replace(/\s|\u00a0/g,'').replace(/kč/gi,'');
  if(s==='') return null;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>-1) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(s);

function nbParseTable(rows){
  let cat='prace'; const items=[];
  const catWord=(t)=>{ const n=norm(t); if(n.includes('material'))return 'material'; if(n.includes('doprava'))return 'doprava'; if(n.includes('rezie')||n.includes('vedlejsi'))return 'rezie'; if(n.includes('demontaz')||n.includes('montaz')||n.includes('prace'))return 'prace'; return null; };
  const skipWord=(t)=>{ const n=norm(t); return ['rozpis prac','m.j.','m. j.','vymera','jedn. cena','jedn cena','cena celkem','celkem'].some(w=>n.includes(w)); };

    if(!row) return;
    const cells=row.map(c=>c==null?'':(''+c).trim());
    const nonEmpty=cells.filter(c=>c!=='');
    if(!nonEmpty.length) return;
    const joined=nonEmpty.join(' ');
    const nums=[]; cells.forEach(c=>{ if(c!==''){ const v=parseCena(c); if(v!=null) nums.push(v); } });
    const ck=catWord(joined);
    if(ck && nums.length===0){ cat=ck; return; }
    if(nums.length<2) return;
    let popisIdx=-1;
    for(let i=0;i<cells.length;i++){ if(cells[i]!=='' && parseCena(cells[i])==null){ popisIdx=i; break; } }
    if(popisIdx<0) return;
    const popis=cells[popisIdx];
    if(!popis || skipWord(popis)) return;
    let mj='ks';
    for(let i=popisIdx+1;i<cells.length;i++){ if(cells[i]!=='' && parseCena(cells[i])==null){ mj=cells[i]; break; } }

    const mnozstvi=nums.length>=3?nums[nums.length-3]:1;
    items.push({nazev:popis, mj, mnozstvi, cena, sleva:0, kat:cat});
  });

}

      m=/^\$?([A-Z]{1,3})\$?(\d+)(?![\d(])/.exec(rest);

    const num=v=>{ if(typeof v==='number') return v; const p=parseCena(v); return p==null?0:p; };
    const rozsah=(a,b)=>{ const out=[]; const c1=XLSX.utils.decode_col(a.col), c2=XLSX.utils.decode_col(b.col);
      for(let r=Math.min(a.row,b.row);r<=Math.max(a.row,b.row);r++) for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++) out.push(num(cellVal(a.list, XLSX.utils.encode_col(c)+r, hl)));
      return out; };
    const args=()=>{ const out=[]; ws_(); if(s[i]===')'){ i++; return out; }
      for(;;){ ws_(); const st=i; const a=ref(); ws_();
        if(a && s[i]===':'){ i++; ws_(); const b=ref(); if(!b) throw 0; out.push(...rozsah(a,b)); }
        else { i=st; out.push(expr()); }
        ws_(); if(s[i]===','||s[i]===';'){ i++; continue; } if(s[i]===')'){ i++; break; } throw 0; }

    const factor=()=>{ ws_();

      if(s[i]==='('){ i++; const v=expr(); ws_(); if(s[i]!==')') throw 0; i++; return v; }
      const fm=/^([A-Z]+)\(/.exec(s.slice(i));
      if(fm){ i+=fm[0].length; const a=args(); const n=fm[1];

        if(n==='ROUND'||n==='ROUNDUP'||n==='ROUNDDOWN'){ const d=Math.pow(10,a[1]||0); const fn=n==='ROUND'?Math.round:n==='ROUNDUP'?Math.ceil:Math.floor; return fn(a[0]*d)/d; }

function xlsSloupecTyp(t){

  if(/celkem|castka|suma|cena celk|cena za polozku|mezisoucet/.test(n)) return 'celkem';
  if(/^(mj|m\.j\.|m\. j\.|jedn(otka)?\.?|j\.)$/.test(n)) return 'mj';
  if(/cena|sazba|kc\/|jedn\.? ?c|j\.? ?cena/.test(n)) return 'cena';
  if(/mnozstvi|^mn\.?$|pocet|hodin|^hod\.?$|vymera|^ks$/.test(n)) return 'mnozstvi';
  if(/popis|polozk|nazev|cinnost|^text$|predmet|specifikace|^prace$|^material$|druh prac|oznaceni/.test(n)) return 'popis';

function xlsKat(t){ const n=norm(t); if(!n) return null;

  if(n.includes('demontaz')||n.includes('montaz')||n.includes('prace')||n.includes('cinnost')||n.includes('hodin')) return 'prace';

const XLS_SOUCET=/(^|\s)(celkem|soucet|mezisoucet|sum[ae]?|rekapitulace|dph|zaokrouhl)/;

  const skryte=((wb.Workbook||{}).Sheets||[]);
  wb.SheetNames.forEach((jmeno, si)=>{
    if(skryte[si] && skryte[si].Hidden) return;
    const {grid}=xlsHodnoty(wb, jmeno);
    const txt=v=>typeof v==='string' ? v.trim() : '';
    const cislo=v=>{ if(typeof v==='number') return v; if(typeof v==='string' && /\d/.test(v) && !/[a-zA-ZÀ-ſ]{2,}/.test(v.replace(/kč/gi,''))) return parseCena(v); return null; };
    let blokRekap=false;

      // předmět zakázky

      const lbl=texty.find(t=>t)||'';
      const nl=norm(lbl);
      if(/celkem bez dph|cena bez dph|zaklad celkem|celkova cena bez/.test(nl)){ const nums=row.map(cislo).filter(v=>v!=null); if(nums.length) out.celkem[jmeno]={castka:nums[nums.length-1], popis:lbl}; }
      // nadpis bloku rekapitulace

  return out;
}

function platno(img, maxW, maxH) { const k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight); const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; }

    if (chybi.length) { try { rows = rows.concat(await katTabulka({ kody: chybi, pocet: chybi.length }) || []); } catch (e) { } }
    rows = await katDoplnBaleni(rows.filter(Boolean));
    return rows.filter(r => !r.neaktivni).map(katProKalk);
  },
  vychoziPrirazka: 15,
  pamet: { cti: (k, v) => { try { const x = localStorage.getItem('yeyodhad:' + k); return x == null ? v : x; } catch (e) { return v; } },
           pis: (k, v) => { try { localStorage.setItem('yeyodhad:' + k, v); } catch (e) { } } },
  toast: (t, err) => toast(t, { chyba: !!err }),
  jenStavimex: false,
  bezStavimexu: true,
  svZKatalogu: true,
  cenaPopis: 'orientační cena',
  stxDostupne: () => false,
  /** Hledání v katalogu. Se sortimentem se přidá dotaz omezený na jeho témata, bez hledaného slova se vrátí zboží sortimentu. */
  async hledej(q0, pocet, sort) {
    if (!katPristup()) return [];
    const temata = YeyKalk.sortiment.temata(await katTemata(), sort);
    const slova = String(q0 || '').split(/\s+/).filter(Boolean), bez = slova.filter(w => w[0] === '-' && w.length > 2).map(w => w.slice(1));
    const q = slova.filter(w => w[0] !== '-').join(' ');
    let rows = [];
    if (q && q.trim().length >= 2) {
      const [a, b] = await Promise.allSettled([
        bez.length ? katRpc('katalog_hledat_bez', { dotaz: q, pocet: Math.max(pocet, 60), bez }) : katRpc('katalog_hledat_vse', { dotaz: q, pocet: Math.max(pocet, 60) }),
        temata.length ? katTabulka({ slova: q, temata, pocet, bez }) : Promise.resolve([])
      ]);
      if (a.status === 'fulfilled' && Array.isArray(a.value)) rows = rows.concat(a.value);
      if (b.status === 'fulfilled' && Array.isArray(b.value)) rows = rows.concat(b.value);
      const vid = new Set(); rows = rows.filter(r => r && r.kod && !vid.has(r.kod) && vid.add(r.kod));
      rows = await katDoplnBaleni(rows);
    } else if (temata.length || (sort && sort.skupina)) {
      try { rows = await katTabulka({ temata, skupina: sort.skupina, pocet: Math.max(pocet, 120) }); } catch (e) { rows = []; }
    }
    return rows.filter(r => !r.neaktivni).map(katProKalk);
  },
  zasoby: null,
  cenik: () => (S.cenik || []).map(c => ({ id: c.id, kod: null, nazev: c.nazev, mj: c.mj, cena: Number(c.cena) || 0, typ: c.kategorie })),
  cilDokladu: () => { const d = UI.kalkCil ? doklad(UI.kalkCil) : null; return d ? (d.typ === 'nabidka' ? 'nabídky ' : d.typ === 'protokol' ? 'protokolu ' : 'faktury ') + d.cislo : null; },
  async doDokladu(radky, meta) {
    let d = UI.kalkCil ? doklad(UI.kalkCil) : null;
    if (!d) d = await novyDoklad('nabidka', { predmet: meta?.kalkulacka || '' });
    const pol = await nactiPolozky(d.id, true);
    const platce = !!S.firma.platce_dph;
    const rows = radky.map((r, i) => ({ id: uid(), doklad_id: d.id, firma_id: S.firma.id, poradi: pol.length + i, nazev: r.nazev || '', mnozstvi: Math.round((Number(r.mnozstvi) || 0) * 1000) / 1000, mj: r.mj || null,
      cena: Math.round((Number(r.cena) || 0) * 100) / 100, dph: platce ? ((r.sazba_dph != null && r.sazba_dph !== '') ? Number(r.sazba_dph) : 21) : 0, kat: r.kod ? 'material' : (r.typ === 'prace' || r.typ === 'práce' ? 'prace' : 'material') }));
    if (rows.length) await q(sb.from('polozky').insert(rows));
    await nactiPolozky(d.id, true); await obnovDoklad(d.id);
    UI.kalkCil = null;
    toast(`Do ${TYP[d.typ].toLowerCase()} ${d.cislo} vloženo ${rows.length} položek. Zkontrolujte odběratele a ceny.`);
    jdi('doklad/' + d.id);
  }
};
/* Funkce, které modul čeká od yey.cz (licenční brána). V Moje kanceláři je vkládání do dokladů dostupné všem. */
function zamceno() { return false; }
function licBrana() { return false; }
/* Kam se vkládá: doklad, ze kterého byla kalkulačka otevřena, jiný rozpracovaný doklad, nebo nová nabídka. */
function kalkCilHtml() {
  const moznosti = S.doklady.filter(d => d.typ !== 'protokol' && ['koncept', 'odeslano'].includes(d.stav) || d.id === UI.kalkCil).slice(0, 60);
  return `<div class="karta" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px">
    <span class="tuc">Výsledek vložit do:</span>
    <select id="kalkCilSel" class="vstup" style="flex:1;min-width:240px;height:42px">
      <option value="">+ Nové nabídky (založí se při vložení)</option>
      ${moznosti.map(d => `<option value="${d.id}" ${d.id === UI.kalkCil ? 'selected' : ''}>${TYP[d.typ]} ${esc(d.cislo)} – ${esc(kontakt(d.kontakt_id)?.nazev || zakazka(d.zakazka_id)?.nazev || d.predmet || 'bez odběratele')}</option>`).join('')}
    </select>
    ${UI.kalkCil ? `<a class="btn mal" href="#doklad/${UI.kalkCil}">← Zpět do dokladu</a>` : ''}</div>`;
}
let KK_ROOT = null;
POHLEDY.kalkulacky = t => {
  const cil = t.p.get('doklad'); if (cil) UI.kalkCil = cil;
  if (UI.kalkCil && !doklad(UI.kalkCil)) UI.kalkCil = null;
  return { plna: true, html: `<div id="kk-misto" style="padding:18px 22px 60px;min-width:0">${kalkCilHtml()}</div>`, po: () => {
    const m = $('#kk-misto'); if (!m || !window.YeyKalk) return;
    $('#kalkCilSel').onchange = e => { UI.kalkCil = e.target.value || null; try { YeyKalk.prekresli(); } catch { } };
    if (!KK_ROOT) { KK_ROOT = document.createElement('div'); KK_ROOT.id = 'kk-root'; m.appendChild(KK_ROOT); YeyKalk.init(kalkAdapter, KK_ROOT); }
    else m.appendChild(KK_ROOT);
    YeyKalk.ukazano();
    if (!katPristup() && S.firma?.licence) katToken().then(t => { if (t) try { YeyKalk.katalogZmena(); } catch { } });
  } };
};

/* =================== START =================== */
let startBezi = false;
async function start() {
  startBezi = true;
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null; S.nacteno = false;
  if (S.user) { try { await nactiFirmu(); } catch { } }
  nactiKalkHledani(); if (S.firma?.licence) katToken().then(t => { if (t) try { YeyKalk.katalogZmena(); } catch { } });
  startBezi = false; render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') { S.user = session?.user; UI.prihlRezim = 'noveheslo'; return setTimeout(() => renderPrihlaseni({ t: 'inf', m: 'Zadejte nové heslo.' }), 0); }
  if (ev === 'SIGNED_IN' && !S.user && !startBezi) setTimeout(start, 0);
  if (ev === 'SIGNED_OUT') { Object.assign(S, { user: null, firma: null, nacteno: false }); render(); }
});
/* Při vstupu do číselného pole se celý obsah označí, takže počáteční 0 (nebo jakákoli hodnota) se rovnou přepíše */
document.addEventListener('focusin', e => { const t = e.target; if (t.matches?.('input[inputmode=decimal], input[type=number], input[name=dph]')) setTimeout(() => { try { t.select(); } catch { } }, 0); });
start();
</script>
